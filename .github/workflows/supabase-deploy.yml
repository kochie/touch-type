name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-canary.[0-9]+"

jobs:
  deploy:
    name: Deploy Supabase
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out touch-type-backend
        uses: actions/checkout@v4
        with:
          repository: kochie/touch-type-backend
          token: ${{ secrets.GH_PAT }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID

      - name: Deploy database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy ai-coach-chat
          supabase functions deploy billing-portal
          supabase functions deploy challenges
          supabase functions deploy confirm-checkout-session
          supabase functions deploy create-checkout-session
          supabase functions deploy create-streak-freeze-checkout
          supabase functions deploy delete-user
          supabase functions deploy finalize-checkout-session
          supabase functions deploy finalize-streak-freeze-checkout
          supabase functions deploy generate-ai-insights
          supabase functions deploy generate-custom-drill
          supabase functions deploy goals
          supabase functions deploy iap-webhook
          supabase functions deploy leaderboards
          supabase functions deploy map-transaction
          supabase functions deploy recommendations
          supabase functions deploy refresh-streak-freezes
          supabase functions deploy results
          supabase functions deploy send-notifications
          supabase functions deploy settings
          supabase functions deploy subscription
          supabase functions deploy update-subscription-interval

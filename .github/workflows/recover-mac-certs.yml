name: Recover Mac Certs

# One-shot recovery workflow — bundles the macOS signing secrets into an
# artifact encrypted with secrets.recovery_passphrase. Delete this file + the
# recovery_passphrase secret after the artifact has been downloaded.
#
# Usage:
#   1. Set a temporary repo secret `recovery_passphrase` (16+ char string).
#   2. Run this workflow via the Actions UI (workflow_dispatch).
#   3. Download the `mac-certs-recovery` artifact from the run page.
#   4. Decrypt locally:
#        openssl enc -d -aes-256-cbc -pbkdf2 -salt -iter 200000 \
#          -in recovery.tar.gz.enc \
#          -out recovery.tar.gz \
#          -pass pass:'<your passphrase>'
#        tar xzf recovery.tar.gz
#   5. Delete this workflow file, delete the `recovery_passphrase` secret,
#      and (recommended) rotate the macOS signing secrets.

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Decode secrets and encrypt bundle
        env:
          MAC_CERTS_B64: ${{ secrets.mac_certs }}
          MAC_CERTS_PW: ${{ secrets.mac_certs_password }}
          MAS_PROV_B64: ${{ secrets.provisioning_profile }}
          MAC_PROV_B64: ${{ secrets.mac_provisioning_profile }}
          API_KEY_B64: ${{ secrets.api_key }}
          API_KEY_ID: ${{ secrets.api_key_id }}
          API_ISSUER: ${{ secrets.api_key_issuer_id }}
          RECOVERY_PASSPHRASE: ${{ secrets.recovery_passphrase }}
        run: |
          set -euo pipefail

          if [ -z "${RECOVERY_PASSPHRASE:-}" ]; then
            echo "::error::secrets.recovery_passphrase is not set. Add a temporary repo secret named recovery_passphrase and re-run."
            exit 1
          fi

          mkdir -p recovery

          # base64-encoded secrets -> raw bytes
          printf '%s' "$MAC_CERTS_B64" | base64 -d > recovery/mac-certs.p12
          printf '%s' "$MAS_PROV_B64"  | base64 -d > recovery/mas-touchtyper.provisionprofile
          printf '%s' "$MAC_PROV_B64"  | base64 -d > recovery/mac-touchtyper.provisionprofile
          printf '%s' "$API_KEY_B64"   | base64 -d > "recovery/AuthKey_${API_KEY_ID}.p8"

          # Plain string secrets
          printf '%s' "$MAC_CERTS_PW" > recovery/mac-certs-password.txt
          printf '%s' "$API_KEY_ID"   > recovery/api_key_id.txt
          printf '%s' "$API_ISSUER"   > recovery/api_issuer.txt

          # Show file types + sizes WITHOUT contents
          echo "Bundle contents:"
          ( cd recovery && for f in *; do printf '  %-40s %s\n' "$f" "$(file -b "$f")"; done )

          tar czf recovery.tar.gz -C recovery .
          openssl enc -aes-256-cbc -pbkdf2 -salt -iter 200000 \
            -in recovery.tar.gz \
            -out recovery.tar.gz.enc \
            -pass env:RECOVERY_PASSPHRASE

          # Wipe plaintext before the artifact upload step runs
          rm -rf recovery recovery.tar.gz

          echo "Encrypted bundle ready:"
          ls -la recovery.tar.gz.enc

      - name: Upload encrypted bundle
        uses: actions/upload-artifact@v4
        with:
          name: mac-certs-recovery
          path: recovery.tar.gz.enc
          retention-days: 1
          if-no-files-found: error

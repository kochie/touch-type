name: Release Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to build (e.g. v1.2.3)"
        required: true
        default: ""
        type: string
      enable_debug:
        description: "Print signing diagnostics + verbose electron-builder logs"
        required: false
        default: false
        type: boolean

# Stable release workflow. Mirrors beta_build.yml's structure (macOS Xcode 26,
# split mac default + mas invocations, altool failure detection, profile UUID
# print) but tagged-release semantics: no version suffix, channel=stable,
# always upload to App Store / Windows Dev Center, GitHub Release as draft.
#
# Beta/alpha go through beta_build.yml (branch push). Stable goes through
# this workflow (tag push) — `pnpm version patch && git push --tags` is the
# canonical release command.

jobs:
  reserve_build_number:
    name: Reserve App Store build number
    uses: ./.github/workflows/reserve-app-store-build-number.yml
    secrets:
      REPO_VARIABLES_PAT: ${{ secrets.GH_TOKEN_FOR_VARIABLES }}

  make_release:
    name: Make GitHub Release (draft)
    runs-on: ubuntu-latest
    steps:
      - uses: ncipollo/release-action@v1
        with:
          # Draft so release notes can be edited before going public. The
          # build job publishes installers into this draft via `--publish always`.
          draft: true
          prerelease: false
          generateReleaseNotes: true
          skipIfReleaseExists: true

  build:
    name: Build and Upload
    needs: reserve_build_number
    runs-on: ${{ matrix.os }}

    strategy:
      # One macos runner per Apple target so codesign keychain operations
      # don't serialize, and a default-target failure doesn't abort the
      # mas-target build (or vice versa). Non-macOS rows have no mac_target.
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            mac_target: default
          - os: macos-26
            mac_target: mas
          - os: ubuntu-latest
            mac_target: ""
          # Native arm64 Linux runner — produces aarch64 snap, AppImage, and
          # flatpak artifacts. electron-builder auto-detects host arch, so
          # no extra CLI flags are needed; all the existing ubuntu-* steps
          # match `startsWith(matrix.os, 'ubuntu')` and run as-is on arm64.
          - os: ubuntu-24.04-arm
            mac_target: ""
          - os: windows-latest
            mac_target: ""

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Sync package.json to the tag — otherwise a developer who forgot to
      # bump before tagging ships an old version. The ref is passed via env
      # rather than ${{ ... }} interpolation so untrusted input can't break
      # out of the shell context (workflow-injection guard). The tag is
      # regex-validated before any value flows into node.
      - name: Set release version from tag
        shell: bash
        env:
          INPUT_REF: ${{ github.event.inputs.ref || github.ref }}
        run: |
          tag="${INPUT_REF##*/}"   # refs/tags/v1.2.3 → v1.2.3
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            export RELEASE_VERSION="${tag#v}"
            node -e "
              const fs = require('fs');
              const p = require('./package.json');
              p.version = process.env.RELEASE_VERSION;
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
              console.log('Set version to', p.version);
            "
          else
            echo "Non-tag build; keeping package.json version $(jq -r .version package.json)"
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: latest
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - uses: actions/cache@v5
        name: Setup cache for next.js
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: |
          pnpm install
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
          APPLE_API_KEY: ${{ startsWith(matrix.os, 'macos') && format('private_keys/AuthKey_{0}.p8', secrets.api_key_id) || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(matrix.os, 'macos') && secrets.api_key_id || '' }}
          APPLE_API_ISSUER: ${{ startsWith(matrix.os, 'macos') && secrets.api_key_issuer_id || '' }}

      - name: Rebuild native deps for Electron
        run: pnpm exec electron-builder install-app-deps

      - name: Install Snapcraft + Multipass
        # Pin snapcraft to 7.x/stable: the latest/stable channel ships
        # snapcraft 8 which only builds inside LXD or multipass and won't
        # honour --destructive-mode through electron-builder's app-builder.
        # 7.x builds on the host with no VM at all.
        #
        # Multipass is installed as a fallback in case snapcraft (any
        # version) probes for it before checking other backends —
        # snapcraft does this on first run and aborts with a multipass
        # error even when it would have built on host. Having the binary
        # present satisfies the probe; whether or not a VM ever launches
        # is moot because 7.x builds on host anyway.
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo snap install snapcraft --channel=7.x/stable --classic
          sudo snap install multipass
          snapcraft --version
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.snapcraft_token }}

      - name: Install Flatpak
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08

      - name: Set up Xcode
        if: startsWith(matrix.os, 'macos')
        run: |
          # electron-builder 26.x requires actool 26+ (Xcode 26) for .icon asset catalog compilation
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -runFirstLaunch

      - name: Prepare App Store Connect API key
        if: startsWith(matrix.os, 'macos')
        env:
          API_KEY_BASE64: ${{ secrets.api_key }}
          API_KEY_PATH: private_keys/AuthKey_${{ secrets.api_key_id }}.p8
          ENABLE_DEBUG: ${{ inputs.enable_debug == true }}
        run: |
          mkdir -p private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode --output $API_KEY_PATH

          if [[ "$ENABLE_DEBUG" == "true" ]]; then
            # Provisioning profiles live in build/ (committed — not secret).
            # Print UUIDs so logs can tell which profile is wired into the bundle.
            echo "=== Committed provisioning profiles ==="
            for f in build/mas-touchtyper-prod.provisionprofile build/mac-touchtyper-prod.provisionprofile; do
              uuid=$(security cms -D -i "$f" 2>/dev/null | plutil -convert xml1 -o - - | awk '/<key>UUID<\/key>/{getline; gsub(/.*<string>|<\/string>.*/,""); print; exit}')
              size=$(wc -c <"$f")
              echo "  $f : UUID=$uuid (size=$size bytes)"
            done
          fi

      - name: Build Electron app
        run: pnpm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ startsWith(matrix.os, 'ubuntu') && secrets.snapcraft_token || '' }}
          # Snapcraft 8+ defaults to building inside a multipass VM, which
          # isn't installed on GitHub Actions runners. "host" puts it in
          # destructive mode — builds run directly on the runner. Harmless
          # on older snapcraft (used by ubuntu-latest x64) and required on
          # newer (ubuntu-24.04-arm).
          SNAPCRAFT_BUILD_ENVIRONMENT: ${{ startsWith(matrix.os, 'ubuntu') && 'host' || '' }}
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.supabase_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.supabase_anon_key }}
          NEXT_PUBLIC_ACCOUNT_LINK: https://touch-typer.kochie.io/account
          NEXT_PUBLIC_WEBSITE_URL: https://touch-typer.kochie.io
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.stripe_publishable_key }}

      - name: Build/Release Electron app (stable channel, publish always)
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          MAC_TARGET: ${{ matrix.mac_target }}

          # macOS builds
          APPLE_API_KEY: ${{ startsWith(matrix.os, 'macos') && format('private_keys/AuthKey_{0}.p8', secrets.api_key_id) || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(matrix.os, 'macos') && secrets.api_key_id || '' }}
          APPLE_API_ISSUER: ${{ startsWith(matrix.os, 'macos') && secrets.api_key_issuer_id || '' }}
          MAC_LINK: ${{ startsWith(matrix.os, 'macos') && secrets.mac_certs || '' }}
          MAC_KEY_PASSWORD: ${{ startsWith(matrix.os, 'macos') && secrets.mac_certs_password || '' }}

          # Ubuntu builds
          SNAPCRAFT_STORE_CREDENTIALS: ${{ startsWith(matrix.os, 'ubuntu') && secrets.snapcraft_token || '' }}

          # Common
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_VERSION: ${{ (matrix.os == 'macos-26' && needs.reserve_build_number.outputs.build_number) || github.run_number }}
          CHANNEL: stable
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
          # Verbose electron-builder logging only when debug is on — otherwise
          # the logs are full of cert selection noise that drowns out signal.
          DEBUG: ${{ inputs.enable_debug == true && 'electron-builder' || '' }}
        run: |
          echo "Building for $MATRIX_OS, mac_target=$MAC_TARGET, CHANNEL=stable, publish=always"
          if [[ "$MATRIX_OS" == macos* ]]; then
            # mac default and mas run on SEPARATE matrix entries (parallel
            # runners). See beta_build.yml's matching step for the full
            # explanation of why these must not share a single invocation.
            pnpm exec electron-builder --config electron-builder.ts --mac "$MAC_TARGET" --universal --publish always
          elif [[ "$MATRIX_OS" == windows* ]]; then
            pnpm exec electron-builder --config electron-builder.ts -w --publish always
          else
            pnpm exec electron-builder --config electron-builder.ts -l --publish always
          fi

      - name: Diagnose macOS signing
        # Verbose signing diagnostics — keychain identities, codesign output,
        # cert chain, embedded provisioning profile. Toggle via the
        # workflow_dispatch `enable_debug` input.
        if: startsWith(matrix.os, 'macos') && always() && inputs.enable_debug == true
        shell: bash
        env:
          MAC_TARGET: ${{ matrix.mac_target }}
        run: |
          set +e
          # mac_target=default builds land in dist/mac-universal/, mas in
          # dist/mas-universal/. Each runner only built one of them.
          if [[ "$MAC_TARGET" == "default" ]]; then
            VARIANT=mac-universal
          else
            VARIANT=mas-universal
          fi

          echo "=== Signing identities in keychain ==="
          security find-identity -v -p codesigning

          echo ""
          echo "============================================================"
          echo "  $VARIANT"
          echo "============================================================"
          APP=$(find "dist/$VARIANT" -maxdepth 2 -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "(no .app in dist/$VARIANT)"
            exit 0
          fi
          echo "App: $APP"

          echo ""
          echo "--- codesign -dvv ---"
          codesign -dvv "$APP" 2>&1

          echo ""
          echo "--- Authority chain (cert SHA-1s) ---"
          codesign -d --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|CDHash"

          echo ""
          echo "--- Embedded provisioning profile ---"
          PP="$APP/Contents/embedded.provisionprofile"
          if [ -f "$PP" ]; then
            security cms -D -i "$PP" 2>/dev/null | plutil -convert xml1 -o - - \
              | grep -A2 -E "Name|TeamIdentifier|DeveloperCertificates|aps-environment|application-identifier"
          else
            echo "(no embedded.provisionprofile)"
          fi

      # Snap stable upload — keep commented until the package is ready for
      # the stable Snap track. Uncomment when promoting from edge/beta.
      # - name: Upload to Snap Store (stable)
      #   if: startsWith(matrix.os, 'ubuntu')
      #   run: |
      #     name=$(jq -r .name package.json)
      #     version=$(jq -r .version package.json)
      #     snapcraft upload "dist/${name}_${version}_amd64.snap" --release=stable
      #   env:
      #     SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.snapcraft_token }}

      - name: Upload to App Store Connect
        # Only the mas-target build produces dist/mas-universal/*.pkg, so the
        # default-target matrix entry has nothing to upload to ASC. Skip it.
        if: matrix.mac_target == 'mas'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.api_key_id }}
          APPLE_API_ISSUER_ID: ${{ secrets.api_key_issuer_id }}
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          pkg="dist/mas-universal/Touch Typer-$version-universal.pkg"

          # altool exits 0 on validation/upload failure (long-standing Apple
          # bug). Capture stdout+stderr and grep for the failure banner so
          # the workflow actually fails.
          echo "Validating $pkg..."
          xcrun altool --validate-app -f "$pkg" --type macos \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID" \
            2>&1 | tee altool-validate.log
          if grep -qE 'VERIFY FAILED|UPLOAD FAILED|Failed to validate' altool-validate.log; then
            echo "::error::altool reported validation errors above"
            exit 1
          fi

          echo "Uploading $pkg..."
          xcrun altool --upload-app -f "$pkg" --type macos \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID" \
            2>&1 | tee altool-upload.log
          if grep -qE 'VERIFY FAILED|UPLOAD FAILED|Failed to upload' altool-upload.log; then
            echo "::error::altool reported upload errors above"
            exit 1
          fi

      - name: Upload to Windows Dev Center
        if: startsWith(matrix.os, 'windows')
        run: |
          # Fail loudly on any cmdlet error. Without this, New-SubmissionPackage
          # silently dropping the appx would leave submission.zip with only
          # PDP metadata; Update-ApplicationSubmission -ReplacePackages would
          # then no-op on packages (no new array to replace with), and the
          # Store would keep certifying the previous appx version while we
          # think we shipped a new one. That bug rode through v2.0.3 → v3.0.7
          # before being caught.
          $ErrorActionPreference = "Stop"

          # Discover the appx via glob rather than matching an exact filename.
          # electron-builder's appx artifact name is sensitive to productName
          # and version interpolation; hardcoded strings drift silently.
          $appxFiles = @(Get-ChildItem -Path "$env:GITHUB_WORKSPACE\dist" -Filter "*.appx" -File)
          Write-Host "dist/ contents (.appx):"
          $appxFiles | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
          if ($appxFiles.Count -eq 0) {
            throw "No .appx found in dist/ — electron-builder appx target did not produce output"
          }
          $appx = $appxFiles[0].FullName
          Write-Host "Selected appx: $appx"

          Set-PSRepository -Name "PSGallery" -InstallationPolicy Trusted
          Install-Module -Name StoreBroker

          $password = ConvertTo-SecureString $env:APPX_UPLOAD_TOKEN -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential $env:APPX_UPLOAD_USERNAME, $password
          Set-StoreBrokerAuthentication -TenantId $env:APPX_UPLOAD_TENANT_ID -Credential $credential

          New-SubmissionPackage -ConfigPath build\store_broker\SBConfig.json -AppxPath $appx

          # Verify the appx actually made it into submission.zip before any
          # upload attempt. If this trips, the upload would silently leave
          # the previously-published package in place.
          if (-not (Test-Path "build/submission.zip")) {
            throw "submission.zip was not produced by New-SubmissionPackage"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = (Resolve-Path "build/submission.zip").Path
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName })
            Write-Host "submission.zip contains $($entries.Count) entries:"
            $entries | ForEach-Object { Write-Host "  $_" }
            $hasAppx = @($entries | Where-Object { $_ -like "*.appx" -or $_ -like "*.appxbundle" -or $_ -like "*.msixbundle" }).Count -gt 0
            if (-not $hasAppx) {
              throw "submission.zip has no .appx/.appxbundle/.msixbundle entry — Store would keep the previous package"
            }
          } finally {
            $zip.Dispose()
          }

          Update-ApplicationSubmission -AppId $env:APPX_UPLOAD_APP_ID -SubmissionDataPath "build/submission.json" -PackagePath "build/submission.zip" -Force -ReplacePackages -UpdatePublishModeAndVisibility
        env:
          APPX_UPLOAD_TOKEN: ${{ secrets.windows_dev_center_password }}
          APPX_UPLOAD_USERNAME: ${{ secrets.windows_dev_center_username }}
          APPX_UPLOAD_TENANT_ID: ${{ secrets.windows_dev_center_tenant_id }}
          APPX_UPLOAD_APP_ID: "9NG3CCFL631D"

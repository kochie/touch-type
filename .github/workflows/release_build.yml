name: Release Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to build (e.g. v1.2.3)"
        required: true
        default: ""
        type: string

# Stable release workflow. Mirrors beta_build.yml's structure (macOS Xcode 26,
# split mac default + mas invocations, altool failure detection, profile UUID
# print) but tagged-release semantics: no version suffix, channel=stable,
# always upload to App Store / Windows Dev Center, GitHub Release as draft.
#
# Beta/alpha go through beta_build.yml (branch push). Stable goes through
# this workflow (tag push) — `pnpm version patch && git push --tags` is the
# canonical release command.

jobs:
  reserve_build_number:
    name: Reserve App Store build number
    uses: ./.github/workflows/reserve-app-store-build-number.yml
    secrets:
      REPO_VARIABLES_PAT: ${{ secrets.GH_TOKEN_FOR_VARIABLES }}

  make_release:
    name: Make GitHub Release (draft)
    runs-on: ubuntu-latest
    steps:
      - uses: ncipollo/release-action@v1
        with:
          # Draft so release notes can be edited before going public. The
          # build job publishes installers into this draft via `--publish always`.
          draft: true
          prerelease: false
          generateReleaseNotes: true
          skipIfReleaseExists: true

  build:
    name: Build and Upload
    needs: reserve_build_number
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-26, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Sync package.json to the tag — otherwise a developer who forgot to
      # bump before tagging ships an old version. The ref is passed via env
      # rather than ${{ ... }} interpolation so untrusted input can't break
      # out of the shell context (workflow-injection guard). The tag is
      # regex-validated before any value flows into node.
      - name: Set release version from tag
        shell: bash
        env:
          INPUT_REF: ${{ github.event.inputs.ref || github.ref }}
        run: |
          tag="${INPUT_REF##*/}"   # refs/tags/v1.2.3 → v1.2.3
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            export RELEASE_VERSION="${tag#v}"
            node -e "
              const fs = require('fs');
              const p = require('./package.json');
              p.version = process.env.RELEASE_VERSION;
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
              console.log('Set version to', p.version);
            "
          else
            echo "Non-tag build; keeping package.json version $(jq -r .version package.json)"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - uses: actions/cache@v4
        name: Setup cache for next.js
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: |
          pnpm install
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
          APPLE_API_KEY: ${{ startsWith(matrix.os, 'macos') && format('private_keys/AuthKey_{0}.p8', secrets.api_key_id) || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(matrix.os, 'macos') && secrets.api_key_id || '' }}
          APPLE_API_ISSUER: ${{ startsWith(matrix.os, 'macos') && secrets.api_key_issuer_id || '' }}

      - name: Rebuild native deps for Electron
        run: pnpm exec electron-builder install-app-deps

      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v1
        if: startsWith(matrix.os, 'ubuntu')
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.snapcraft_token }}

      - name: Install Flatpak
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08

      - name: Set up Xcode
        if: startsWith(matrix.os, 'macos')
        run: |
          # electron-builder 26.x requires actool 26+ (Xcode 26) for .icon asset catalog compilation
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -runFirstLaunch

      - name: Prepare for app notarization
        if: startsWith(matrix.os, 'macos')
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.provisioning_profile }}
          PP_PATH: build/mas-touchtyper.provisionprofile
          MAC_PROVISION_PROFILE_BASE64: ${{ secrets.mac_provisioning_profile }}
          MAC_PP_PATH: build/mac-touchtyper.provisionprofile
          API_KEY_BASE64: ${{ secrets.api_key }}
          API_KEY_PATH: private_keys/AuthKey_${{ secrets.api_key_id }}.p8
        run: |
          mkdir -p private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode --output $API_KEY_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode --output $PP_PATH
          echo -n "$MAC_PROVISION_PROFILE_BASE64" | base64 --decode --output $MAC_PP_PATH

          # Verify which profile is in each file (UUID is unique per profile,
          # secret-masking won't redact it like it does the Name field).
          echo "=== Profile UUIDs after decode ==="
          for f in "$PP_PATH" "$MAC_PP_PATH"; do
            uuid=$(security cms -D -i "$f" 2>/dev/null | plutil -convert xml1 -o - - | awk '/<key>UUID<\/key>/{getline; gsub(/.*<string>|<\/string>.*/,""); print; exit}')
            size=$(wc -c <"$f")
            echo "  $f : UUID=$uuid (size=$size bytes)"
          done

      - name: Build Electron app
        run: pnpm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ startsWith(matrix.os, 'ubuntu') && secrets.snapcraft_token || '' }}
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.supabase_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.supabase_anon_key }}
          NEXT_PUBLIC_ACCOUNT_LINK: https://touch-typer.kochie.io/account
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.stripe_publishable_key }}

      - name: Build/Release Electron app (stable channel, publish always)
        shell: bash
        run: |
          echo "Building for ${{ matrix.os }}, CHANNEL=stable, publish=always"
          if [[ "${{ matrix.os }}" == macos* ]]; then
            # Same split as beta_build.yml — combining --mac default and
            # --mac mas in one invocation causes electron-builder to share
            # universal-merge intermediates between targets and the MAS
            # bundle ends up with the Developer ID provisioning profile
            # embedded (because codesign --force replaces the signature,
            # not embedded.provisionprofile). altool then rejects with
            # "Missing code-signing certificate".
            pnpm exec electron-builder --config electron-builder.ts --mac default --universal --publish always
            pnpm exec electron-builder --config electron-builder.ts --mac mas --universal --publish always
          elif [[ "${{ matrix.os }}" == windows* ]]; then
            pnpm exec electron-builder --config electron-builder.ts -w --publish always
          else
            pnpm exec electron-builder --config electron-builder.ts -l --publish always
          fi
        env:
          # macOS builds
          APPLE_API_KEY: ${{ startsWith(matrix.os, 'macos') && format('private_keys/AuthKey_{0}.p8', secrets.api_key_id) || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(matrix.os, 'macos') && secrets.api_key_id || '' }}
          APPLE_API_ISSUER: ${{ startsWith(matrix.os, 'macos') && secrets.api_key_issuer_id || '' }}
          MAC_LINK: ${{ startsWith(matrix.os, 'macos') && secrets.mac_certs || '' }}
          MAC_KEY_PASSWORD: ${{ startsWith(matrix.os, 'macos') && secrets.mac_certs_password || '' }}

          # Ubuntu builds
          SNAPCRAFT_STORE_CREDENTIALS: ${{ startsWith(matrix.os, 'ubuntu') && secrets.snapcraft_token || '' }}

          # Common
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_VERSION: ${{ (matrix.os == 'macos-26' && needs.reserve_build_number.outputs.build_number) || github.run_number }}
          CHANNEL: stable
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
          DEBUG: electron-builder

      - name: Diagnose macOS signing
        if: startsWith(matrix.os, 'macos') && always()
        shell: bash
        run: |
          set +e

          echo "=== Signing identities in keychain ==="
          security find-identity -v -p codesigning

          for variant in mas-universal mac-universal; do
            echo ""
            echo "============================================================"
            echo "  $variant"
            echo "============================================================"
            APP=$(find "dist/$variant" -maxdepth 2 -name "*.app" -type d 2>/dev/null | head -1)
            if [ -z "$APP" ]; then
              echo "(no .app in dist/$variant)"
              continue
            fi
            echo "App: $APP"

            echo ""
            echo "--- codesign -dvv ---"
            codesign -dvv "$APP" 2>&1

            echo ""
            echo "--- Authority chain (cert SHA-1s) ---"
            codesign -d --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|CDHash"

            echo ""
            echo "--- Embedded provisioning profile ---"
            PP="$APP/Contents/embedded.provisionprofile"
            if [ -f "$PP" ]; then
              security cms -D -i "$PP" 2>/dev/null | plutil -convert xml1 -o - - \
                | grep -A2 -E "Name|TeamIdentifier|DeveloperCertificates|aps-environment|application-identifier"
            else
              echo "(no embedded.provisionprofile)"
            fi
          done

      # Snap stable upload — keep commented until the package is ready for
      # the stable Snap track. Uncomment when promoting from edge/beta.
      # - name: Upload to Snap Store (stable)
      #   if: startsWith(matrix.os, 'ubuntu')
      #   run: |
      #     name=$(jq -r .name package.json)
      #     version=$(jq -r .version package.json)
      #     snapcraft upload "dist/${name}_${version}_amd64.snap" --release=stable
      #   env:
      #     SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.snapcraft_token }}

      - name: Upload to App Store Connect
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.api_key_id }}
          APPLE_API_ISSUER_ID: ${{ secrets.api_key_issuer_id }}
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          pkg="dist/mas-universal/Touch Typer-$version-universal.pkg"

          # altool exits 0 on validation/upload failure (long-standing Apple
          # bug). Capture stdout+stderr and grep for the failure banner so
          # the workflow actually fails.
          echo "Validating $pkg..."
          xcrun altool --validate-app -f "$pkg" --type macos \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID" \
            2>&1 | tee altool-validate.log
          if grep -qE 'VERIFY FAILED|UPLOAD FAILED|Failed to validate' altool-validate.log; then
            echo "::error::altool reported validation errors above"
            exit 1
          fi

          echo "Uploading $pkg..."
          xcrun altool --upload-app -f "$pkg" --type macos \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID" \
            2>&1 | tee altool-upload.log
          if grep -qE 'VERIFY FAILED|UPLOAD FAILED|Failed to upload' altool-upload.log; then
            echo "::error::altool reported upload errors above"
            exit 1
          fi

      - name: Upload to Windows Dev Center
        if: startsWith(matrix.os, 'windows')
        run: |
          $jsonContent = Get-Content -Path "$env:GITHUB_WORKSPACE\package.json" -Raw
          $jsonObject = $jsonContent | ConvertFrom-Json
          $version = $jsonObject.version
          $appx = "./dist/Touch Typer $version.appx"

          Set-PSRepository -Name "PSGallery" -InstallationPolicy Trusted
          Install-Module -Name StoreBroker

          $password = ConvertTo-SecureString $env:APPX_UPLOAD_TOKEN -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential $env:APPX_UPLOAD_USERNAME, $password
          Set-StoreBrokerAuthentication -TenantId $env:APPX_UPLOAD_TENANT_ID -Credential $credential

          New-SubmissionPackage -ConfigPath build\store_broker\SBConfig.json -AppxPath $appx

          Update-ApplicationSubmission -AppId $env:APPX_UPLOAD_APP_ID -SubmissionDataPath "build/submission.json" -PackagePath "build/submission.zip" -Force -ReplacePackages -UpdatePublishModeAndVisibility
        env:
          APPX_UPLOAD_TOKEN: ${{ secrets.windows_dev_center_password }}
          APPX_UPLOAD_USERNAME: ${{ secrets.windows_dev_center_username }}
          APPX_UPLOAD_TENANT_ID: ${{ secrets.windows_dev_center_tenant_id }}
          APPX_UPLOAD_APP_ID: "9NG3CCFL631D"
